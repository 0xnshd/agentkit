[tools]
go = "latest"
golangci-lint = "latest"
mage = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
"go:github.com/cweill/gotests/gotests" = "latest"

[shell_alias]
tidy = "go mod tidy"
vuln = "govulncheck ./..."
sc = "mage -d scripts"

[hooks]
enter = "mkdir -p \"$CACHE\" \"$GOCACHE\""

[env]
CACHE = "{{config_root}}/.cache"
GOCACHE = "{{config_root}}/.cache/go"

[tasks.lint]
description = "Run lint"
run = "mage -d scripts lint"
